<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TextCatch — Messages</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#141416">
<link rel="apple-touch-icon" href="/api/icon?n=180">
<!-- Legacy iOS reads this rather than the manifest to decide whether the
     home-screen launch is chromeless. Without it, "Add to Home Screen" gives
     a Safari window with a URL bar, and Apple gates web push on the app being
     genuinely standalone - so this line is what makes notifications possible. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TextCatch">
<style>
  :root {
    --bg: #141416;
    --panel: #1c1c1e;
    --panel2: #232326;
    --line: rgba(255,255,255,.08);
    --text: #f2f2f4;
    --muted: #8a8a8e;
    --accent: #16B57A;
    --accent2: #109A66;
    --them: #2f2f33;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ---------- sign in ---------- */
  #signin { display: none; min-height: 100%; align-items: center; justify-content: center; padding: 24px; }
  #signin.on { display: flex; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px;
  }
  .brand { font-weight: 800; font-size: 20px; margin: 0 0 4px; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=email], textarea {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font-size: 15px; font-family: inherit;
  }
  input[type=email]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 11px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent2); }
  button:disabled { opacity: .55; cursor: default; }
  .full { width: 100%; margin-top: 14px; }
  .note { font-size: 13px; margin-top: 14px; }
  .note.err { color: #e25555; }
  .note.ok { color: var(--accent); }

  /* ---------- app ---------- */
  #app { display: none; height: 100%; }
  #app.on { display: flex; }
  aside {
    width: 320px; flex-shrink: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  .head {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .head b { font-size: 15px; }
  .head .num { color: var(--muted); font-size: 12px; display: block; font-weight: 400; }
  .linkbtn { background: none; color: var(--muted); font-weight: 400; font-size: 13px; padding: 4px; }
  .linkbtn:hover { background: none; color: var(--text); }
  #list { flex: 1; overflow-y: auto; }
  .thread {
    padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .thread:hover { background: var(--panel2); }
  .thread.sel { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 13px; }
  .thread .who { font-weight: 600; font-size: 14px; }
  .thread .prev { color: var(--muted); font-size: 13px; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .when { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(560px, 78%); padding: 9px 13px; border-radius: 14px; font-size: 14.5px; word-wrap: break-word; white-space: pre-wrap; }
  .msg.inbound { background: var(--them); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.outbound { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .stamp { font-size: 11px; color: var(--muted); margin: -4px 2px 4px; }
  .stamp.out { align-self: flex-end; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { resize: none; min-height: 44px; max-height: 140px; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 40px; }

  /* ---------- conversation header ---------- */
  /* Without this the first message bubble sits underneath the iPhone status
     bar - the app is standalone and draws edge to edge, so nothing else pushes
     it down. It also holds the only way back to the list on a phone. */
  #convhead { flex-shrink: 0; }
  #convhead .who { flex: 1; min-width: 0; text-align: center; }
  #convhead b { display: block; font-size: 15px; }
  #convhead .num { color: var(--muted); font-size: 12px; }
  #back { font-size: 15px; padding: 4px 8px; margin-left: -8px; }
  /* Keeps the name optically centred against the back button's width. */
  #convhead .spacer { width: 44px; flex-shrink: 0; }
  @media (min-width: 721px) {
    #back, #convhead .spacer { display: none; }
    #convhead .who { text-align: left; }
  }

  /* ---------- notifications banner ---------- */
  #notif {
    display: none; padding: 11px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel2); font-size: 13px; color: var(--muted);
    align-items: center; gap: 10px; justify-content: space-between;
  }
  #notif.on { display: flex; }
  #notif button { padding: 7px 12px; font-size: 13px; white-space: nowrap; }
  #notif .msg { line-height: 1.35; }
  #notif b { color: var(--text); font-weight: 600; }

  /* Standalone on an iPhone draws under the notch and the home indicator.
     Without these the header sits behind the clock and Send is under the bar. */
  .head { padding-top: calc(14px + env(safe-area-inset-top)); }
  .composer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #signin { padding-top: calc(24px + env(safe-area-inset-top)); }

  @media (max-width: 720px) {
    #app.on { flex-direction: column; }
    /* One pane at a time on a phone: the list fills the screen until you open a
       conversation, then the conversation does. An earlier 42% cap on the list
       left two thirds of the screen empty black, which reads as a broken app. */
    aside { width: 100%; flex: 1; min-height: 0; border-right: 0; border-bottom: 0; }
    #app.reading aside { display: none; }
    #app:not(.reading) main { display: none; }
    .composer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<section id="signin">
  <div class="card">
    <p class="brand">Text<span>Catch</span></p>
    <p class="sub">Sign in to read and answer your texts.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@yourbusiness.com">
    <button id="send" class="full">Email me a sign-in link</button>
    <p id="note" class="note"></p>
  </div>
</section>

<section id="app">
  <aside>
    <div class="head">
      <div>
        <b>Messages</b>
        <span class="num">(808) 977-6179</span>
      </div>
      <button id="refresh" class="linkbtn">Refresh</button>
    </div>
    <div id="notif">
      <span class="msg" id="notifMsg"></span>
      <button id="notifBtn" type="button">Turn on</button>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="head" id="convhead" style="display:none">
      <button id="back" class="linkbtn" type="button" aria-label="Back to all conversations">‹ All</button>
      <div class="who">
        <b id="convName"></b>
        <span class="num" id="convNum"></span>
      </div>
      <span class="spacer"></span>
    </div>
    <div id="msgs"><p class="empty">Pick a conversation.</p></div>
    <div class="composer" id="composer" style="display:none">
      <textarea id="reply" rows="1" placeholder="Write a text…"></textarea>
      <button id="sendReply">Send</button>
    </div>
    <p id="sendNote" class="note" style="margin:0 16px 12px"></p>
  </main>
</section>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var threads = [];
  var current = null;

  function show(which) {
    $("signin").classList.toggle("on", which === "signin");
    $("app").classList.toggle("on", which === "app");
  }

  function when(iso) {
    if (!iso) return "";
    var d = new Date(iso), now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " +
        d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function prettyPhone(p) {
    var m = String(p || "").match(/^\+1(\d{3})(\d{3})(\d{4})$/);
    return m ? "(" + m[1] + ") " + m[2] + "-" + m[3] : (p || "unknown");
  }

  // textContent everywhere, never innerHTML: message bodies come from
  // strangers and must never be able to run as markup.
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderList() {
    var list = $("list");
    list.textContent = "";
    if (!threads.length) {
      list.appendChild(el("p", "empty", "No conversations yet. Text (808) 977-6179 to make one."));
      return;
    }
    threads.forEach(function (t) {
      var row = el("div", "thread" + (current && current.id === t.id ? " sel" : ""));
      row.appendChild(el("div", "who", t.name || prettyPhone(t.phone)));
      row.appendChild(el("div", "prev", (t.lastDirection === "outbound" ? "You: " : "") + (t.preview || "")));
      row.appendChild(el("div", "when", when(t.lastMessageAt)));
      row.addEventListener("click", function () { open(t); });
      list.appendChild(row);
    });
  }

  function renderThread() {
    var box = $("msgs");
    box.textContent = "";
    if (!current) {
      box.appendChild(el("p", "empty", "Pick a conversation."));
      $("composer").style.display = "none";
      $("convhead").style.display = "none";
      return;
    }
    $("convhead").style.display = "flex";
    $("convName").textContent = current.name || prettyPhone(current.phone);
    // If we have a name the number would otherwise be invisible, and it is the
    // one thing worth being able to read off the screen while on the phone.
    $("convNum").textContent = current.name ? prettyPhone(current.phone) : "";
    if (!current.messages.length) {
      box.appendChild(el("p", "empty", "No messages yet."));
    }
    current.messages.forEach(function (m) {
      box.appendChild(el("div", "msg " + m.direction, m.body || ""));
      box.appendChild(el("div", "stamp" + (m.direction === "outbound" ? " out" : ""), when(m.at)));
    });
    $("composer").style.display = "flex";
    box.scrollTop = box.scrollHeight;
  }

  function open(t) {
    current = t;
    $("app").classList.add("reading");
    renderList();
    renderThread();
    $("sendNote").textContent = "";
  }

  async function load() {
    var r = await fetch("/api/portal/threads", { credentials: "same-origin" });
    if (r.status === 401) { show("signin"); return false; }
    if (!r.ok) { $("sendNote").textContent = "Could not load conversations."; return false; }
    var j = await r.json();
    threads = j.threads || [];
    if (current) {
      var again = threads.filter(function (t) { return t.id === current.id; })[0];
      current = again || null;
    }
    show("app");
    renderList();
    renderThread();
    return true;
  }

  // ---- sign in ----
  $("send").addEventListener("click", async function () {
    var email = $("email").value.trim();
    var note = $("note");
    if (!email) { note.className = "note err"; note.textContent = "Enter your email."; return; }
    $("send").disabled = true;
    try {
      var r = await fetch("/api/portal/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email }),
      });
      var j = await r.json();
      note.className = "note ok";
      note.textContent = j.message || "Check your inbox.";
    } catch (e) {
      note.className = "note err";
      note.textContent = "Something went wrong. Try again.";
    }
    $("send").disabled = false;
  });

  $("email").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("send").click();
  });

  // ---- reply ----
  async function sendReply() {
    var text = $("reply").value.trim();
    var note = $("sendNote");
    if (!current || !text) return;
    $("sendReply").disabled = true;
    note.className = "note";
    note.textContent = "Sending…";
    try {
      var r = await fetch("/api/portal/reply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ conversationId: current.id, body: text }),
      });
      var j = await r.json();
      if (!r.ok) {
        note.className = "note err";
        note.textContent = j.error || "Could not send.";
      } else {
        $("reply").value = "";
        note.className = "note ok";
        note.textContent = "Sent.";
        await load();
      }
    } catch (e) {
      note.className = "note err";
      note.textContent = "Could not send.";
    }
    $("sendReply").disabled = false;
  }

  $("sendReply").addEventListener("click", sendReply);
  $("reply").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendReply();
  });
  $("refresh").addEventListener("click", function () { load(); });

  // Back to the list. Deliberately keeps `current` set so returning to the
  // thread does not lose your place, and does not touch the URL - this runs as
  // an installed app, where a history entry per tap is a trap.
  function goBack() {
    $("app").classList.remove("reading");
    $("sendNote").textContent = "";
  }
  $("back").addEventListener("click", goBack);

  // The iPhone's edge swipe does nothing in a standalone PWA, so give the
  // gesture people will try anyway something to do.
  (function () {
    var x0 = null, y0 = null;
    var box = document.querySelector("main");
    box.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    box.addEventListener("touchend", function (e) {
      if (x0 === null || x0 > 40) return;
      var t = e.changedTouches[0];
      if (t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 50) goBack();
      x0 = null;
    }, { passive: true });
  })();

  // ---- notifications -----------------------------------------------------
  //
  // The whole point of this app. Everything below exists to get one iPhone to
  // buzz, which Apple makes conditional on the app being installed to the home
  // screen first - so the unsupported case is a set of instructions, not an
  // apology.

  var reg = null;
  var notifState = "unknown";

  function isIos() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      // iPadOS 13+ reports itself as a Mac; the touch points give it away.
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isInstalled() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function banner(text, buttonLabel, onClick) {
    var box = $("notif"), btn = $("notifBtn");
    if (!text) { box.classList.remove("on"); return; }
    $("notifMsg").textContent = text;
    box.classList.add("on");
    if (!buttonLabel) { btn.style.display = "none"; return; }
    btn.style.display = "";
    btn.textContent = buttonLabel;
    btn.onclick = onClick;
  }

  // The applicationServerKey has to be raw bytes, not the base64url string the
  // API hands us.
  function urlBase64ToUint8Array(base64) {
    var s = (base64 + "=".repeat((4 - (base64.length % 4)) % 4))
      .replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(s);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function subscribe() {
    banner("Asking your phone for permission…", null);
    try {
      var permission = await Notification.requestPermission();
      if (permission !== "granted") return refreshNotifUi();

      var conf = await (await fetch("/api/portal/push", { credentials: "same-origin" })).json();
      if (!conf.publicKey) {
        banner("Notifications are not configured on the server yet.", null);
        return;
      }

      var existing = await reg.pushManager.getSubscription();
      var sub = existing || await reg.pushManager.subscribe({
        // Required by every browser: we promise each push shows something.
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(conf.publicKey),
      });

      var r = await fetch("/api/portal/push", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subscription: sub.toJSON() }),
      });
      if (!r.ok) throw new Error("server refused the device");

      banner("Notifications are on for this device.", "Turn off", unsubscribe);
      notifState = "on";
    } catch (e) {
      banner("Could not turn on notifications: " + (e.message || e), "Try again", subscribe);
    }
  }

  async function unsubscribe() {
    try {
      var sub = await reg.pushManager.getSubscription();
      if (sub) {
        await fetch("/api/portal/push", {
          method: "DELETE",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ endpoint: sub.endpoint }),
        });
        await sub.unsubscribe();
      }
    } catch (e) {}
    notifState = "off";
    refreshNotifUi();
  }

  async function refreshNotifUi() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      // On an iPhone this is not a dead end - it is the "not installed yet" case.
      if (isIos() && !isInstalled()) {
        banner("To get alerts when a lead texts: tap Share, then Add to Home Screen, and open TextCatch from there.", null);
      } else {
        banner("This browser can't do notifications. Open the app on your phone instead.", null);
      }
      return;
    }
    if (isIos() && !isInstalled()) {
      banner("Tap Share, then Add to Home Screen. Open it from there to turn on alerts.", null);
      return;
    }
    if (Notification.permission === "denied") {
      banner("Notifications are blocked. Turn them back on in your phone's Settings, under TextCatch.", null);
      return;
    }
    if (!reg) { banner(null); return; }

    var sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") {
      // Quietly re-register: a phone can hold a subscription the server has
      // forgotten (restored backup, database restore), and the symptom is
      // simply silence, which nobody notices until a lead is lost.
      fetch("/api/portal/push", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subscription: sub.toJSON() }),
      }).catch(function () {});
      banner("Notifications are on for this device.", "Turn off", unsubscribe);
      notifState = "on";
      return;
    }
    banner("Get an alert the moment a lead texts you.", "Turn on", subscribe);
    notifState = "off";
  }

  async function initServiceWorker() {
    if (!("serviceWorker" in navigator)) return refreshNotifUi();
    try {
      reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      navigator.serviceWorker.addEventListener("message", function (e) {
        if (e.data && e.data.type === "refresh") load();
      });
    } catch (e) {
      console.error("Service worker registration failed", e);
    }
    refreshNotifUi();
  }

  // Opening the app is an implicit "I have seen these", so clear the red dot.
  function clearBadge() {
    if (navigator.clearAppBadge) { try { navigator.clearAppBadge(); } catch (e) {} }
  }

  // ---- boot ----
  var params = new URLSearchParams(location.search);
  if (params.get("error")) {
    $("note").className = "note err";
    $("note").textContent = params.get("error") === "expired"
      ? "That link expired or was already used. Request a new one."
      : "The portal is not configured yet.";
  }

  load().then(function (signedIn) {
    if (!signedIn) { show("signin"); return; }
    clearBadge();
    initServiceWorker();
  });

  // Quietly refresh while the tab is open, so new texts appear without a click.
  setInterval(function () {
    if ($("app").classList.contains("on") && document.visibilityState === "visible") load();
  }, 20000);

  // Coming back to the app after a notification should show the new message
  // straight away rather than up to twenty seconds later.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && $("app").classList.contains("on")) {
      clearBadge();
      load();
    }
  });
})();
</script>
</body>
</html>
